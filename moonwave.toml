description = "Serialize values directly. Dynamo infers compact wire types at runtime, no schema modules to share or keep in sync."

[[home.features]]
title = "Great performance"
description = "Native codegen, localized buffer ops, and tight type handlers keep hot paths focused on throughput."

[[home.features]]
